[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sys-net-diag"
version = "1.0.0"
description = "Cross-platform Python CLI tool for L1 IT Support and Network Troubleshooting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
sys-net-diag = "sys_net_diag.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
